services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite embeds these at build time — rebuild after changing any of them
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:3000}
        VITE_DEVCLUB_CLIENT_ID: ${VITE_DEVCLUB_CLIENT_ID}
        VITE_DEVCLUB_OAUTH_BASE_URL: ${VITE_DEVCLUB_OAUTH_BASE_URL:-https://auth.devclub.in}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
