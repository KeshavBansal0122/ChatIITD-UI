services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      # These are baked into the build at npm run build time.
      # To change them, rebuild the image.
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:3000}
      VITE_DEVCLUB_CLIENT_ID: ${VITE_DEVCLUB_CLIENT_ID}
      VITE_DEVCLUB_OAUTH_BASE_URL: ${VITE_DEVCLUB_OAUTH_BASE_URL:-https://oauth.devclub.in}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
